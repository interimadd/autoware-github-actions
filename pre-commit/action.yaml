name: pre-commit
description: ""

inputs:
  pre-commit-config:
    description: ""
    required: true
  base-branch:
    description: ""
    required: false
  token:
    description: ""
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set git config
      uses: autowarefoundation/autoware-github-actions/set-git-config@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1
      with:
        token: ${{ inputs.token }}

    - name: Set option
      id: set-option
      run: |
        if [ -z "${{ inputs.base-branch }}" ]; then
          echo "option=--all-files" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "option=--from-ref ${{ inputs.base-branch }} --to-ref HEAD" >> $GITHUB_OUTPUT
      shell: bash

    # pre-commit/action is not used because it calls actions/cache by tag, which is rejected when SHA pinning is enforced.
    - name: Install pre-commit
      run: |
        python -m pip install pre-commit
        python -m pip freeze --local > "$RUNNER_TEMP/pip.freeze"
        echo "python-version=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      id: install-pre-commit
      shell: bash

    - name: Cache pre-commit environments
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ steps.install-pre-commit.outputs.python-version }}|${{ hashFiles(inputs.pre-commit-config) }}

    - name: Run pre-commit
      run: pre-commit run --show-diff-on-failure --color=always --config ${{ inputs.pre-commit-config }} ${{ steps.set-option.outputs.option }}
      shell: bash

    - name: Push pre-commit fixes
      if: always() # Push changes even when pre-commit fails
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: "style(pre-commit): autofix"
        add_options: -u
